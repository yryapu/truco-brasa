# Sobe o servidor e roda o teste de interface contra ele. Dois serviços, uma rede interna:
# o Playwright fala com `http://truco:8080` e nada precisa ser publicado na máquina.
services:
  truco:
    build: .
    environment:
      TRUCO_ENDERECO: "0.0.0.0:8080"
      TRUCO_BANCO: "sqlite:///tmp/truco.db"
      RUST_LOG: "info"
      # O bot age quase na hora: o teste prova o fluxo, não a animação.
      TRUCO_PAUSA_BOT_MS: "60"
    tmpfs: ["/tmp"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  front:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    # Chromium usa /dev/shm para memória compartilhada entre os seus processos. O padrão do
    # Docker é 64 MB; com várias abas e uma interface com animação ele estoura e o navegador
    # morre com "Target crashed". É pegadinha conhecida de rodar Chromium em container.
    shm_size: "1gb"
    depends_on:
      truco:
        condition: service_healthy
    working_dir: /teste
    volumes: ["./teste-front:/teste"]
    environment:
      BASE: "http://truco:8080"
      CI: "1"
    # A versão do `@playwright/test` é **fixa e igual à da imagem** (sem `^`): a imagem traz
    # os navegadores de uma versão só, e um `^1.56.0` instala 1.57 ou 1.58, que procura um
    # build de Chromium que não está ali. Foi exatamente o erro que apareceu na primeira
    # execução: "Executable doesn't exist at /ms-playwright/chromium_headless_shell-1243".
    command: sh -lc "npm install --no-audit --no-fund --silent && npx playwright test"

  # Tira as fotos do README. Bot lento de propósito: o truco esperando resposta dura menos
  # que um piscar com o bot normal, e é um dos momentos que a foto precisa mostrar.
  capturas:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    shm_size: "1gb"
    profiles: ["capturas"]
    depends_on:
      truco:
        condition: service_healthy
    working_dir: /teste
    volumes: ["./teste-front:/teste"]
    environment:
      BASE: "http://truco:8080"
      CI: "1"
    command: sh -lc "npm install --no-audit --no-fund --silent && npx playwright test --config=playwright.capturas.config.js"
